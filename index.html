<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dog Breed Fetcher</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Main Card Container (gaya ng nasa whiteboard drawing) */
    .card {
      background: #ffffff;
      width: 380px;
      padding: 28px 24px;
      border: 2px solid #222;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Dropdown sa taas */
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #222;
      border-radius: 6px;
      background-color: #fff;
      cursor: pointer;
      text-transform: capitalize;
    }

    /* Lalagyan ng picture ng aso sa gitna */
    .image-box {
      width: 100%;
      height: 260px;
      border: 2px solid #222;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fafafa;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder-text {
      color: #666;
      font-size: 14px;
    }

    /* Button sa ibaba */
    button {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #222;
      border-radius: 6px;
      background-color: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #9ca3af;
      border-color: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. Select Breed Dropdown -->
    <select id="breedSelect">
      <option value="">Select Breed</option>
    </select>

    <!-- 2. Dog Image Container -->
    <div class="image-box" id="imageBox">
      <span class="placeholder-text">Pumili ng breed sa taas</span>
    </div>

    <!-- 3. Fetch Again Button -->
    <button id="fetchBtn" disabled>Fetch Again</button>
  </div>

  <script>
    const breedSelect = document.getElementById("breedSelect");
    const imageBox = document.getElementById("imageBox");
    const fetchBtn = document.getElementById("fetchBtn");

    // Step 1: Kunin ang listahan ng lahat ng breeds mula sa Dog API
    async function loadBreeds() {
      try {
        const response = await fetch("https://dog.ceo/api/breeds/list/all");
        const data = await response.json();
        const breeds = Object.keys(data.message);

        breeds.forEach((breed) => {
          const option = document.createElement("option");
          option.value = breed;
          option.textContent = breed.charAt(0).toUpperCase() + breed.slice(1);
          breedSelect.appendChild(option);
        });
      } catch (error) {
        console.error("Error loading breeds:", error);
      }
    }

    // Step 2: Kunin ang random image ng napiling breed
    async function fetchDogImage(breed) {
      if (!breed) return;

      imageBox.innerHTML = `<span class="placeholder-text">Loading...</span>`;

      try {
        const response = await fetch(`https://dog.ceo/api/breed/${breed}/images/random`);
        const data = await response.json();

        imageBox.innerHTML = `<img src="${data.message}" alt="${breed}" />`;
      } catch (error) {
        imageBox.innerHTML = `<span class="placeholder-text">May error sa pag-load ng image.</span>`;
        console.error("Error fetching dog image:", error);
      }
    }

    // Kapag nagpalit ng breed sa dropdown
    breedSelect.addEventListener("change", () => {
      const selectedBreed = breedSelect.value;
      if (selectedBreed) {
        fetchBtn.disabled = false;
        fetchDogImage(selectedBreed);
      } else {
        fetchBtn.disabled = true;
        imageBox.innerHTML = `<span class="placeholder-text">Pumili ng breed sa taas</span>`;
      }
    });

    // Kapag pinindot ang "Fetch Again" button
    fetchBtn.addEventListener("click", () => {
      const selectedBreed = breedSelect.value;
      fetchDogImage(selectedBreed);
    });

    // I-run agad ang pag-load ng breeds pagbukas ng page
    loadBreeds();
  </script>

</body>
</html>
